<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZEBROL</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body class="bg-black text-white">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

firebase.initializeApp({
  apiKey: "AIzaSyBAH2rBIR5ibvde0VMVF38QyM4L2s8IqIQ",
  authDomain: "zebrol.firebaseapp.com",
  projectId: "zebrol",
  appId: "1:846397475446:web:1b38ce35dcae4e1754ed57"
});

const auth = firebase.auth();
const db = firebase.firestore();

async function compressPhoto(file) {
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    throw new Error('Escolha uma foto JPG, PNG ou WebP. Converta fotos HEIC para JPG antes de enviar.');
  }
  if (file.size > 20 * 1024 * 1024) throw new Error('A foto original deve ter no máximo 20 MB.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const picture = new Image();
      picture.onload = () => resolve(picture);
      picture.onerror = () => reject(new Error('Não foi possível abrir essa foto. Escolha outro arquivo.'));
      picture.src = url;
    });
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    if (!context) throw new Error('Este navegador não conseguiu processar a foto.');
    for (const maxSide of [1000, 800, 600, 400]) {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(img, 0, 0, canvas.width, canvas.height);
      for (const quality of [0.85, 0.7, 0.55, 0.4]) {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
        if (blob && blob.size <= 300 * 1024) {
          return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error('Não foi possível ler a foto processada.'));
            reader.readAsDataURL(blob);
          });
        }
      }
    }
    throw new Error('Não foi possível reduzir a foto o suficiente. Escolha outra imagem.');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function saveErrorMessage(error) {
  const code = (error.code || '').replace('firestore/', '');
  if (code === 'permission-denied') return 'O Firebase recusou a gravação. Verifique as regras de acesso do banco.';
  if (code === 'unauthenticated') return 'Sua sessão expirou. Entre novamente antes de salvar.';
  if (code === 'unavailable' || code === 'deadline-exceeded') return 'Não foi possível confirmar a gravação. Verifique sua conexão.';
  if (code === 'resource-exhausted') return 'O Firebase atingiu um limite de uso. Verifique as cotas do projeto.';
  return error.message || 'Não foi possível salvar. Tente novamente.';
}

function App() {
  const [user, setUser] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");

  const [items, setItems] = useState([]);
  const [selected, setSelected] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const [confirmDelete, setConfirmDelete] = useState(false);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null); // ← ADICIONADO

  const [searchOpen, setSearchOpen] = useState(false);
  const [search, setSearch] = useState("");

  const emptyForm = {
    image: "",
    name: "",
    vulgo: "",
    faction: "",
    cpf: "",
    birth: "",
    mother: "",
    infopem: "",
    address: "",
    description: ""
  };

  const [form, setForm] = useState(emptyForm);
  const [processingImage, setProcessingImage] = useState(false);
  const [saving, setSaving] = useState(false);
  const [formError, setFormError] = useState('');
  const [saveStatus, setSaveStatus] = useState('');
  const savingLock = useRef(false);
  const imageLock = useRef(false);
  const busy = saving || processingImage;

  useEffect(() => auth.onAuthStateChanged(setUser), []);

  useEffect(() => {
    if (!user) return;
    return db
      .collection("users")
      .doc(user.uid)
      .collection("items")
      .onSnapshot(snap => {
        setItems(snap.docs.map(d => ({ ...d.data(), id: d.id })));
      });
  }, [user]);

  const handleChange = async e => {
    const { name, value, files } = e.target;
    if (savingLock.current) return;
    if (name !== 'image') {
      setForm(f => ({ ...f, [name]: value }));
      return;
    }
    const file = files && files[0];
    if (!file || imageLock.current) return;
    e.target.value = '';
    imageLock.current = true;
    setProcessingImage(true);
    setFormError('');
    try {
      const image = await compressPhoto(file);
      setForm(f => ({ ...f, image }));
    } catch (error) {
      setFormError(error.message + ' A foto anterior, se houver, foi mantida.');
    } finally {
      imageLock.current = false;
      setProcessingImage(false);
    }
  };

  const saveItem = async () => {
    if (savingLock.current || imageLock.current) return;
    setFormError('');
    if (!user) { setFormError('Entre novamente para salvar.'); return; }
    if (!navigator.onLine) { setFormError('Você está sem conexão. Conecte-se antes de salvar.'); return; }
    const payload = Object.fromEntries(Object.keys(emptyForm).map(key => [key, String(form[key] ?? '')]));
    // Conservative ceiling leaves room for Firestore document metadata.
    if (new TextEncoder().encode(JSON.stringify(payload)).length > 700 * 1024) {
      setFormError('O cadastro está muito grande. Escolha novamente a foto para reduzi-la ou diminua os textos.');
      return;
    }
    savingLock.current = true;
    setSaving(true);
    setSaveStatus('Salvando e aguardando confirmação do servidor…');
    const reminder = setTimeout(() => {
      setSaveStatus('O servidor ainda não confirmou. Verifique a conexão e mantenha esta tela aberta. Não é necessário clicar novamente.');
    }, 15000);
    try {
      const ref = db.collection('users').doc(user.uid).collection('items');
      if (editingId) await ref.doc(editingId).update(payload);
      else await ref.add(payload);
      setForm(emptyForm);
      setEditingId(null);
      setShowForm(false);
      setSelected(null);
    } catch (error) {
      setFormError(saveErrorMessage(error));
    } finally {
      clearTimeout(reminder);
      savingLock.current = false;
      setSaving(false);
      setSaveStatus('');
    }
  };

  const deleteItem = async () => {
    await db
      .collection("users")
      .doc(user.uid)
      .collection("items")
      .doc(confirmDeleteId) // ← AJUSTADO
      .delete();

    setConfirmDelete(false);
    setConfirmDeleteId(null); // ← LIMPA
    setSelected(null);
  };

  const filtered = items
    .filter(i =>
      [i.name, i.vulgo, i.faction]
        .some(v => v?.toLowerCase().includes(search.toLowerCase()))
    )
    .sort((a,b)=>a.name.localeCompare(b.name,"pt-BR",{sensitivity:"base"}));

  if (!user) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4">
        <h1 className="text-3xl font-bold">ZEBROL</h1>
        <input className="bg-gray-800 p-2 rounded w-64" placeholder="Email" onChange={e=>setEmail(e.target.value)} />
        <input type="password" className="bg-gray-800 p-2 rounded w-64" placeholder="Senha" onChange={e=>setPassword(e.target.value)} />
        <button onClick={()=>auth.signInWithEmailAndPassword(email,password)} className="bg-blue-600 px-4 py-2 rounded">
          Entrar
        </button>
      </div>
    );
  }

  return (
    <div className="min-h-screen p-6 space-y-6">
      <h1 className="text-3xl font-bold text-center">ZEBROL</h1>

      {searchOpen && (
        <input
          className="w-full max-w-md mx-auto block bg-gray-900 p-3 rounded"
          placeholder="Pesquisar nome, vulgo ou facção"
          value={search}
          onChange={e=>setSearch(e.target.value)}
        />
      )}

      <div className="grid grid-cols-2 gap-4 max-w-md mx-auto">
        {filtered.map(item=>(
          <div
            key={item.id}
            onClick={()=>setSelected(item)}
            className="bg-gray-900 p-4 rounded cursor-pointer"
          >
            <div className="h-32 bg-gray-700 rounded mb-2 overflow-hidden">
              {item.image && <img src={item.image} className="w-full h-full object-cover" />}
            </div>
            <p className="text-center font-semibold">{item.name}</p>
            <p className="text-center text-sm text-gray-400">{item.vulgo}</p>
          </div>
        ))}
      </div>

      {selected && (
        <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
          <div className="relative bg-gray-900 p-6 rounded max-w-sm w-full">

           <button
  onClick={() => setSelected(null)}
  className="fixed top-6 right-6 text-red-400 text-2xl font-bold z-50"
>
  ×
</button>

            {selected.image && (
              <img src={selected.image} className="w-full object-contain rounded mb-3" />
            )}

            <p><b>Nome:</b> {selected.name}</p>
            <p><b>Vulgo:</b> {selected.vulgo}</p>
            <p><b>Facção:</b> {selected.faction}</p>
            <p><b>CPF:</b> {selected.cpf}</p>
            <p><b>Nasc:</b> {selected.birth}</p>
            <p><b>Mãe:</b> {selected.mother}</p>
            <p><b>Infopem:</b> {selected.infopem}</p>
            <p><b>Endereço:</b> {selected.address}</p>
            <p><b>Descrição:</b> {selected.description}</p>

            <button
              onClick={() => {
                setForm(Object.fromEntries(Object.keys(emptyForm).map(key => [key, selected[key] ?? ''])));
                setFormError('');
                setEditingId(selected.id);
                setShowForm(true);
                setSelected(null);
              }}
              className="fixed bottom-6 left-6 text-blue-500 text-2xl z-50"
            >
              ✏️
            </button>

            <button
              onClick={() => {
                setConfirmDeleteId(selected.id); // ← AJUSTADO
                setConfirmDelete(true);
              }}
              className="fixed bottom-6 right-6 text-red-500 text-2xl z-50"
            >
              🗑️
            </button>
          </div>
        </div>
      )}

      {confirmDelete && (
        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
          <div className="bg-gray-900 p-6 rounded-2xl w-80 space-y-4 text-center">
            <p className="text-lg font-semibold">
              Tem certeza que deseja excluir?
            </p>
            <div className="flex gap-4">
              <button
                onClick={deleteItem}
                className="flex-1 bg-red-600 p-2 rounded-xl"
              >
                Sim
              </button>
              <button
                onClick={() => {
                  setConfirmDelete(false);
                  setConfirmDeleteId(null);
                }}
                className="flex-1 bg-gray-700 p-2 rounded-xl"
              >
                Não
              </button>
            </div>
          </div>
        </div>
      )}

      {!selected && !showForm && (
        <>
          <button
  onClick={()=>setSearchOpen(!searchOpen)}
  className="fixed bottom-6 left-6 text-2xl z-50">
  🔍
</button>
         <button
  onClick={()=>{
    setForm(emptyForm);
    setFormError('');
    setEditingId(null);
    setShowForm(true);
  }}
  className="fixed bottom-6 right-6 text-4xl font-bold text-blue-500 z-40 cursor-pointer"
>
  +
</button>


        </>
      )}

      {showForm && (
        <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50">
          <div className="bg-gray-900 p-4 rounded w-full max-w-sm space-y-2 max-h-[90dvh] overflow-y-auto">
            <fieldset disabled={busy} className="space-y-2 disabled:opacity-70">
            <input type="file" name="image" accept="image/jpeg,image/png,image/webp" onChange={handleChange} aria-label="Foto do cadastro" />
            {form.image && <img src={form.image} alt="Prévia da foto do cadastro" className="max-h-40 mx-auto rounded object-contain" />}
            {processingImage && <p role="status">Reduzindo a foto…</p>}
            {formError && <p role="alert" className="text-red-300 text-sm break-words">{formError}</p>}
            {saving && <p role="status" className="text-blue-200 text-sm">{saveStatus}</p>}

            <input className="w-full bg-gray-800 p-2 rounded" name="name" placeholder="Nome" value={form.name} onChange={handleChange} />
            <input className="w-full bg-gray-800 p-2 rounded" name="vulgo" placeholder="Vulgo" value={form.vulgo} onChange={handleChange} />
            <input className="w-full bg-gray-800 p-2 rounded" name="faction" placeholder="Facção" value={form.faction} onChange={handleChange} />
            <input className="w-full bg-gray-800 p-2 rounded" name="cpf" placeholder="CPF" value={form.cpf} onChange={handleChange} />

            <input className="w-full bg-gray-800 p-2 rounded" name="birth" placeholder="Data de nascimento" value={form.birth} onChange={handleChange} />
            <input className="w-full bg-gray-800 p-2 rounded" name="mother" placeholder="Nome da mãe" value={form.mother} onChange={handleChange} />
            <input className="w-full bg-gray-800 p-2 rounded" name="infopem" placeholder="Infopem" value={form.infopem} onChange={handleChange} />
            <input className="w-full bg-gray-800 p-2 rounded" name="address" placeholder="Endereço" value={form.address} onChange={handleChange} />
            <textarea className="w-full bg-gray-800 p-2 rounded" name="description" placeholder="Descrição" value={form.description} onChange={handleChange} />

            <button onClick={saveItem} disabled={busy} className="w-full bg-blue-600 p-2 rounded disabled:opacity-50 disabled:cursor-not-allowed">{processingImage ? "Processando foto…" : saving ? "Salvando…" : "Salvar"}</button>
            <button disabled={busy} onClick={()=>{ setShowForm(false); setEditingId(null); setFormError(''); }} className="w-full bg-gray-700 p-2 rounded disabled:opacity-50">Cancelar</button>
            </fieldset>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
