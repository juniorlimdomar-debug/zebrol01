<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
  .mobile-overlay { position: fixed; top: var(--viewport-top, 0px); left: 0; right: 0; height: var(--viewport-height, 100dvh); padding: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 60; }
  .mobile-panel { width: 100%; max-height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; overflow-wrap: anywhere; }
  .mobile-scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .mobile-header, .mobile-actions { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .mobile-header { border-bottom: 1px solid #374151; }
  .mobile-actions { padding-top: 4px; padding-bottom: 8px; }
  .mobile-panel button { min-height: 44px; }
  .mobile-photo { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: center; }
  .detail-close { display: flex; justify-content: flex-end; flex-shrink: 0; padding: 4px 12px 0; }
  .mobile-form input:not([type=file]), .mobile-form textarea { font-size: 16px; }
  .mobile-form fieldset { min-width: 0; }
  .mobile-form input[type=file] { max-width: 100%; }
  .detail-panel .mobile-photo { width: var(--detail-photo-width, 100%); max-width: 100%; height: auto; aspect-ratio: 3 / 4; margin-left: auto; margin-right: auto; }
  .detail-overlay { padding: 8px; }
  .detail-panel { position: relative; width: calc(var(--detail-photo-width, 384px) + 24px); max-width: min(408px, 100%); }
  .detail-content { padding: 12px 6px 6px; }
  .detail-photo-wrap { position: relative; width: var(--detail-photo-width, 100%); max-width: 100%; margin: 0 auto; min-height: 44px; }
  .detail-photo-wrap .mobile-photo { width: 100%; margin: 0; }
  .detail-photo-wrap .detail-close { position: absolute; top: 4px; right: 4px; z-index: 1; padding: 0; }
  .detail-panel > .detail-close { position: absolute; top: 0; right: 0; left: auto; z-index: 3; padding: 0; width: 32px; height: 32px; min-height: 32px; }
  .detail-panel > .detail-close button { display: flex; align-items: flex-start; justify-content: flex-end; width: 32px; height: 32px; min-height: 32px; padding: 0 2px 0 0; margin: 0; line-height: 1; }
  .detail-text { margin-top: 8px; padding: 0 6px; }
.desktop-catalog { max-width: none; width: 100%; }
.desktop-catalog-grid { max-width: none; width: 100%; grid-template-columns: repeat(auto-fill, minmax(min(calc((100% - 16px) / 3), 140px), 1fr)); }
.detail-photo-track { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; border-radius:4px; overscroll-behavior-x:contain; }
.detail-photo-track::-webkit-scrollbar { display:none; }
.detail-photo-slot { flex:0 0 100%; width:100%; aspect-ratio:3/4; position:relative; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden; }
.detail-photo-slot img { width:100%; height:100%; object-fit:cover; }
.detail-photo-dots { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; gap:4px; z-index:2; }
.detail-photo-dots button { min-height:24px; width:24px; padding:0; display:flex; align-items:center; justify-content:center; }
.detail-photo-dots span { display:block; width:7px; height:7px; border:1px solid white; border-radius:50%; box-shadow:0 0 2px black; }
</style>

</head>
